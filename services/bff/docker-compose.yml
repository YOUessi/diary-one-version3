services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: diary
      POSTGRES_PASSWORD: diary
      POSTGRES_DB: diary_one
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diary -d diary_one"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  bff:
    build: .
    command: uvicorn bff.main:app --host 0.0.0.0 --port 8790
    ports:
      - "8790:8790"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://diary:diary@postgres:5432/diary_one
      DATABASE_URL_SYNC: postgresql+psycopg://diary:diary@postgres:5432/diary_one
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  worker:
    build: .
    command: python -m worker.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://diary:diary@postgres:5432/diary_one
      DATABASE_URL_SYNC: postgresql+psycopg://diary:diary@postgres:5432/diary_one
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      X02_BASE_URL: ${X02_BASE_URL:-http://host.docker.internal:8787}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  pgdata:
  miniodata:
