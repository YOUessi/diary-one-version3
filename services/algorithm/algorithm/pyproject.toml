[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diary-one-cloud-intelligence"
version = "0.4.1"
description = "Diary One staged real-media preview, Production-shaped V1 reference, and validation harness"
requires-python = ">=3.9"

[project.scripts]
diary-one-ci = "diary_one_ci.cli:main"
diary-one-x01-server = "diary_one_ci.x01_server:main"
diary-one-research-server = "diary_one_ci.x01_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"diary_one_ci.contracts" = ["*.json"]
