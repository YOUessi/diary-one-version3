false}],"moments":[{"text":"在环形码头远眺悉尼歌剧院与海港大桥的经典全景","info":"Part 1 · 5000ms","warning":""},{"text":"走上歌剧院巨大的混凝土基座平台，近距离接触建筑主体","info":"Part 1 · 25000ms","warning":""},{"text":"仰望歌剧院著名的白色贝壳屋顶结构","info":"Part 1 · 65000ms","warning":""},{"text":"穿过Cahill Walkway人行天桥，俯瞰繁忙的渡轮码头","info":"Part 1 · 130000ms","warning":""},{"text":"经过大型邮轮停靠的客运大楼，周围聚集着旅客","info":"Part 1 · 175000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset010_video0p5_c02","title":"岩石区市集与老街风情","story":"镜头转向历史悠久的岩石区（The Rocks）。这里充满了维多利亚时代的砂岩建筑和鹅卵石街道。视频记录了热闹的周末市集，游客们在帐篷摊位间穿梭选购手工艺品和美食。漫步至滨水长廊，在树荫下休憩，并透过铁栏杆眺望海湾对岸的歌剧院与海港大桥，感受新旧交融的城市风貌。","firstSourceSecond":2655.0,"photos":[{"src":"full_chapter_media/video_010_0p5/c02_m001.jpg","sourceAsset":"sydney_01_000266","focusMs":5000,"originalSecond":2655.0,"clipSeq":22,"caption":"岩石区街道旁的露天咖啡馆，充满悠闲的生活气息","hero":true},{"src":"full_chapter_media/video_010_0p5/c02_m002.jpg","sourceAsset":"sydney_01_000302","focusMs":5000,"originalSecond":3015.0,"clipSeq":25,"caption":"岩石区市集的一角，红砖老建筑前搭起了售卖摊位","hero":false},{"src":"full_chapter_media/video_010_0p5/c02_m003.jpg","sourceAsset":"sydney_01_000314","focusMs":5000,"originalSecond":3135.0,"clipSeq":26,"caption":"深入市集内部，琳琅满目的画作和纪念品吸引游客驻足","hero":false},{"src":"full_chapter_media/video_010_0p5/c02_m004.jpg","sourceAsset":"sydney_01_000374","focusMs":5000,"originalSecond":3735.0,"clipSeq":31,"caption":"在岩石区滨海步道散步，头顶是横跨的海港大桥","hero":false},{"src":"full_chapter_media/video_010_0p5/c02_m005.jpg","sourceAsset":"sydney_01_000482","focusMs":5000,"originalSecond":4815.0,"clipSeq":40,"caption":"岩石区现代公寓楼下的宁静内湾，小船静静停泊","hero":false}],"moments":[{"text":"岩石区街道旁的露天咖啡馆，充满悠闲的生活气息","info":"Part 2 · 15000ms","warning":""},{"text":"岩石区市集的一角，红砖老建筑前搭起了售卖摊位","info":"Part 2 · 45000ms","warning":""},{"text":"深入市集内部，琳琅满目的画作和纪念品吸引游客驻足","info":"Part 2 · 55000ms","warning":""},{"text":"在岩石区滨海步道散步，头顶是横跨的海港大桥","info":"Part 2 · 105000ms","warning":""},{"text":"岩石区现代公寓楼下的宁静内湾，小船静静停泊","info":"Part 2 · 195000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset010_video0p5_c03","title":"达令港与海事博物馆","story":"来到现代化的达令港（Darling Harbour）。画面展示了从巴兰加鲁（Barangaroo）延伸至达令港的开阔景观，包括独特的W酒店建筑和游艇码头。重点游览了澳大利亚国家海事博物馆（Australian National Maritime Museum）及其户外展区，近距离观赏了停泊在码头的红色灯塔船、高大的三桅帆船以及退役的军舰，了解悉尼的海洋历史。","firstSourceSecond":5535.0,"photos":[{"src":"full_chapter_media/video_010_0p5/c03_m001.jpg","sourceAsset":"sydney_01_000554","focusMs":5000,"originalSecond":5535.0,"clipSeq":46,"caption":"巴兰加鲁海滨步道，左侧是高楼，右侧是宁静的海湾","hero":true},{"src":"full_chapter_media/video_010_0p5/c03_m002.jpg","sourceAsset":"sydney_01_000698","focusMs":5000,"originalSecond":6975.0,"clipSeq":58,"caption":"达令港地标性建筑——W酒店，外形酷似一艘巨轮","hero":false},{"src":"full_chapter_media/video_010_0p5/c03_m003.jpg","sourceAsset":"sydney_01_000770","focusMs":5000,"originalSecond":7695.0,"clipSeq":64,"caption":"海事博物馆外的红色灯塔船，色彩鲜艳夺目","hero":false},{"src":"full_chapter_media/video_010_0p5/c03_m004.jpg","sourceAsset":"sydney_01_000794","focusMs":5000,"originalSecond":7935.0,"clipSeq":66,"caption":"参观古老的三桅帆船，高耸的桅杆直插云霄","hero":false},{"src":"full_chapter_media/video_010_0p5/c03_m005.jpg","sourceAsset":"sydney_01_000806","focusMs":5000,"originalSecond":8055.0,"clipSeq":67,"caption":"停泊在博物馆旁的大型灰色钢铁战舰","hero":false}],"moments":[{"text":"巴兰加鲁海滨步道，左侧是高楼，右侧是宁静的海湾","info":"Part 3 · 55000ms","warning":""},{"text":"达令港地标性建筑——W酒店，外形酷似一艘巨轮","info":"Part 3 · 175000ms","warning":""},{"text":"海事博物馆外的红色灯塔船，色彩鲜艳夺目","info":"Part 4 · 35000ms","warning":""},{"text":"参观古老的三桅帆船，高耸的桅杆直插云霄","info":"Part 4 · 55000ms","warning":""},{"text":"停泊在博物馆旁的大型灰色钢铁战舰","info":"Part 4 · 65000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset010_video0p5_c04","title":"唐人街与市中心巷弄","story":"穿过繁华的市区进入唐人街（Chinatown）。首先映入眼帘的是标志性的中式牌坊和石狮子。镜头跟随脚步走入狭窄的商业巷弄，探访了热闹的手工艺品市场和特色小吃店。随后回到主街，经过了拥有华丽彩色玻璃窗的圣玛丽大教堂（St Mary's Cathedral）周边，展现了悉尼多元文化的街区面貌。","firstSourceSecond":9490.0,"photos":[{"src":"full_chapter_media/video_010_0p5/c04_m001.jpg","sourceAsset":"sydney_01_000950","focusMs":0,"originalSecond":9490.0,"clipSeq":79,"caption":"唐人街入口处 ","info":"sydney_03_001084-f1","warning":""},{"text":"圣玛丽大教堂内部的祭坛与花窗","info":"sydney_03_001120-f0","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_jpeg_c07","title":"海德公园","story":"走出繁华的商业区，来到了绿意盎然的海德公园（Hyde Park）。阳光透过高大的无花果树洒在林荫道上，公园内有修剪整齐的花坛、草坪和纪念碑雕像。途中还经过了公园内的喷泉广场，背景中隐约可见悉尼塔（Sydney Tower）耸立在蓝天之下。","firstSourceSecond":13593.997,"photos":[{"src":"nexleap_editorial_media/jpeg_030/c07_m01.jpg","sourceAsset":"sydney_03_001360","focusMs":3997,"originalSecond":13593.997,"clipSeq":113,"caption":"真实街景 · 第 113 段代表照片","hero":true},{"src":"nexleap_editorial_media/jpeg_030/c07_m02.jpg","sourceAsset":"sydney_03_001384","focusMs":5005,"originalSecond":13835.005,"clipSeq":115,"caption":"海德公园的林荫大道与喷泉","hero":false},{"src":"nexleap_editorial_media/jpeg_030/c07_m03.jpg","sourceAsset":"sydney_03_001444","focusMs":7006,"originalSecond":14437.006,"clipSeq":120,"caption":"公园草坪上的青铜雕像","hero":false},{"src":"nexleap_editorial_media/jpeg_030/c07_m04.jpg","sourceAsset":"sydney_03_001480","focusMs":3996,"originalSecond":14793.996,"clipSeq":123,"caption":"真实街景 · 第 123 段代表照片","hero":false},{"src":"nexleap_editorial_media/jpeg_030/c07_m05.jpg","sourceAsset":"sydney_03_001492","focusMs":996,"originalSecond":14910.996,"clipSeq":124,"caption":"真实街景 · 第 124 段代表照片","hero":false}],"moments":[{"text":"海德公园的林荫大道与喷泉","info":"sydney_03_001384-f0","warning":""},{"text":"公园草坪上的青铜雕像","info":"sydney_03_001444-f1","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_jpeg_c08","title":"皇家植物园与麦考利夫人之椅","story":"最后来到了紧邻悉尼歌剧院的皇家植物园。这里汇集了各种热带植物、仙人掌和多肉植物园区。沿着蜿蜒的小径行走，经过古老的围墙和茂密的树林，最终抵达著名的观景点“麦考利夫人之椅”，在此可以同时拍到海港大桥和悉尼歌剧院的全景，为旅程画上句号。","firstSourceSecond":15872.006,"photos":[{"src":"nexleap_editorial_media/jpeg_030/c08_m01.jpg","sourceAsset":"sydney_03_001588","focusMs":2006,"originalSecond":15872.006,"clipSeq":132,"caption":"真实街景 · 第 132 段代表照片","hero":true},{"src":"nexleap_editorial_media/jpeg_030/c08_m02.jpg","sourceAsset":"sydney_03_001672","focusMs":1995,"originalSecond":16711.995,"clipSeq":139,"captio _030_0p5/c01_m004.jpg","sourceAsset":"sydney_03_000220","focusMs":5000,"originalSecond":2195.0,"clipSeq":18,"caption":"Cadman's Cottage的历史建筑外观，周围绿树环绕。","hero":false}],"moments":[{"text":"从环形码头远眺悉尼歌剧院，蓝天碧海映衬着白色的帆形屋顶。","info":"Part 1 · 3000ms","warning":""},{"text":"一艘绿色的双层渡轮正驶过波光粼粼的水面，背景是雄伟的海港大桥。","info":"Part 1 · 45000ms","warning":""},{"text":"仰视视角下的悉尼歌剧院，巨大的白色屋顶结构直插云霄。","info":"Part 1 · 62000ms","warning":""},{"text":"Cadman's Cottage的历史建筑外观，周围绿树环绕。","info":"Part 1 · 175000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_video0p5_c02","title":"岩石区市集与历史街区","story":"离开码头区域，镜头转向充满历史韵味的岩石区（The Rocks）。这里正在举办热闹的周末市集，街道两旁摆满了红色的帐篷摊位，售卖各种手工艺品、服装和美食。游客们在鹅卵石街道上穿梭，享受着悠闲的氛围。除了市集，还展示了该区域的古老砖石建筑和迷人的小巷风光。最后，画面经过 Walsh Bay 的现代公寓群，并短暂掠过了达令港（Darling Harbour）的一角，展现了新旧交融的城市景观。","firstSourceSecond":2675.0,"photos":[{"src":"full_chapter_media/video_030_0p5/c02_m001.jpg","sourceAsset":"sydney_03_000268","focusMs":5000,"originalSecond":2675.0,"clipSeq":22,"caption":"岩石区的拱廊商店街，行人穿梭在复古的建筑之下。","hero":true},{"src":"full_chapter_media/video_030_0p5/c02_m002.jpg","sourceAsset":"sydney_03_000304","focusMs":5000,"originalSecond":3035.0,"clipSeq":25,"caption":"热闹的岩石区市集，红色遮阳棚下聚集了许多游客。","hero":false},{"src":"full_chapter_media/video_030_0p5/c02_m003.jpg","sourceAsset":"sydney_03_000472","focusMs":5000,"originalSecond":4715.0,"clipSeq":39,"caption":"Walsh Bay 码头旁的现代住宅楼，红黑相间的外立面很有特色。","hero":false}],"moments":[{"text":"岩石区的拱廊商店街，行人穿梭在复古的建筑之下。","info":"Part 2 · 15000ms","warning":""},{"text":"热闹的岩石区市集，红色遮阳棚下聚集了许多游客。","info":"Part 2 · 45000ms","warning":""},{"text":"Walsh Bay 码头旁的现代住宅楼，红黑相间的外立面很有特色。","info":"Part 2 · 185000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_video0p5_c03","title":"达令港休闲漫步","story":"接下来进入了现代化的达令港（Darling Harbour）区域。这里是休闲娱乐的中心，拥有宽阔的步行道和美丽的水景。镜头记录了沿岸散步的人们，远处可见悉尼会议中心（ICC Sydney）的玻璃幕墙建筑。在港口边，还可以看到停泊的游船和各种水上活动设施。整个区域设计现代且开放，充满了轻松惬意的度假氛围，适合家庭出游和日常散步。","firstSourceSecond":5073.0,"photos":[{"src":"full_chapter_media/video_030_0p5/c03_m001.jpg","sourceAsset" rt 4 · 55000ms","warning":""},{"text":"进入唐人街的标志性牌坊，街道两旁挂满红灯笼。","info":"Part 4 · 165000ms","warning":""},{"text":"Market City 商场的红砖外墙，上面有醒目的广告牌。","info":"Part 4 · 185000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_video0p5_c05","title":"市中心历史建筑与拱廊","story":"这一章节深入悉尼中央商务区（CBD）的历史核心区。首先探访了大型室内市场 Paddy's Markets，感受当地的生活气息。接着来到宏伟的圣玛丽大教堂（St Mary's Cathedral），哥特式的尖塔和精美的彩色玻璃窗令人印象深刻。之后，镜头转向维多利亚女王大厦（Queen Victoria Building, QVB），展示了其华丽的圆顶外观和内部精致的拱廊设计。最后，穿过著名的 Strand Arcade，体验这条历史悠久的高端购物长廊的独特魅力。","firstSourceSecond":10955.0,"photos":[{"src":"full_chapter_media/video_030_0p5/c05_m001.jpg","sourceAsset":"sydney_03_001096","focusMs":5000,"originalSecond":10955.0,"clipSeq":91,"caption":"圣玛丽大教堂的外部细节，沙岩墙面在阳光下显得庄严。","hero":true},{"src":"full_chapter_media/video_030_0p5/c05_m002.jpg","sourceAsset":"sydney_03_001120","focusMs":0,"originalSecond":11190.0,"clipSeq":93,"caption":"教堂内部的中殿视角，彩色的玻璃窗透出神圣的光芒。","hero":false},{"src":"full_chapter_media/video_030_0p5/c05_m003.jpg","sourceAsset":"sydney_03_001132","focusMs":5000,"originalSecond":11315.0,"clipSeq":94,"caption":"维多利亚女王大厦（QVB）标志性的钟楼和圆顶。","hero":false},{"src":"full_chapter_media/video_030_0p5/c05_m004.jpg","sourceAsset":"sydney_03_001192","focusMs":5000,"originalSecond":11915.0,"clipSeq":99,"caption":"Strand Arcade 的入口，古典风格的门楣十分醒目。","hero":false}],"moments":[{"text":"圣玛丽大教堂的外部细节，沙岩墙面在阳光下显得庄严。","info":"Part 5 · 105000ms","warning":""},{"text":"教堂内部的中殿视角，彩色的玻璃窗透出神圣的光芒。","info":"Part 5 · 120000ms","warning":""},{"text":"维多利亚女王大厦（QVB）标志性的钟楼和圆顶。","info":"Part 5 · 135000ms","warning":""},{"text":"Strand Arcade 的入口，古典风格的门楣十分醒目。","info":"Part 5 · 185000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset030_video0p5_c06","title":"乔治街购物区与海德公园","story":"走出拱廊，来到繁忙的乔治街（George Street）。这里是悉尼主要的商业步行街，轻轨列车在街道中间穿行，两旁林立着各大品牌旗舰店。镜头捕捉了街头的人流和现代化的城市节奏。随后，场景转换至宁静的海德公园（Hyde Park），高大的树木提供了凉爽的树荫，公园内的喷泉雕塑是著名的地标。在这里，可以感受到都市喧嚣中的一份宁静与自然之美。","firstSourceSecond":12275.0,"photos":[{"src":"full_chapter_media/video_030_0p5/c06_m001.jpg","sourceAs  · 20000ms","warning":""},{"text":"市集帐篷","info":"Part 2 · 40000ms","warning":""},{"text":"历史建筑","info":"Part 2 · 150000ms","warning":""},{"text":"游艇码头","info":"Part 3 · 0ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset070_video1p0_c03","title":"达令港现代风光","story":"场景转换至现代化的达令港（Darling Harbour）。这里高楼林立，拥有独特的几何造型建筑，如澳大利亚海事博物馆旁的“水晶球”大楼。宽阔的步行道旁停靠着复古风格的游船，远处可见高耸入云的住宅塔楼。画面中还捕捉到了极具未来感的绿色植物覆盖的圆形建筑（One Central Park附近风格或类似垂直绿化建筑），展示了城市绿化与现代建筑的融合。","firstSourceSecond":5950.0,"photos":[{"src":"full_chapter_media/video_070_1p0/c03_m001.jpg","sourceAsset":"sydney_07_000596","focusMs":0,"originalSecond":5950.0,"clipSeq":49,"caption":"锥形摩天楼","hero":true},{"src":"full_chapter_media/video_070_1p0/c03_m002.jpg","sourceAsset":"sydney_07_000632","focusMs":0,"originalSecond":6310.0,"clipSeq":52,"caption":"绿植圆楼","hero":false},{"src":"full_chapter_media/video_070_1p0/c03_m003.jpg","sourceAsset":"sydney_07_000848","focusMs":0,"originalSecond":8470.0,"clipSeq":70,"caption":"海事博物馆","hero":false},{"src":"full_chapter_media/video_070_1p0/c03_m004.jpg","sourceAsset":"sydney_07_000944","focusMs":0,"originalSecond":9430.0,"clipSeq":78,"caption":"W酒店外观","hero":false}],"moments":[{"text":"锥形摩天楼","info":"Part 3 · 80000ms","warning":""},{"text":"绿植圆楼","info":"Part 3 · 110000ms","warning":""},{"text":"海事博物馆","info":"Part 4 · 90000ms","warning":""},{"text":"W酒店外观","info":"Part 4 · 170000ms","warning":""}],"modelStatus":"COMPLETE"},{"id":"offset070_video1p0_c04","title":"唐人街与帕迪市场","story":"随后，镜头带领观众穿过唐人街（Chinatown），街道上悬挂着中文招牌和灯笼，充满了浓郁的东方色彩。接着进入著名的帕迪市场（Paddy's Markets），这是一个大型室内集市。画面展示了市场内琳琅满目的商品，从新鲜蔬果、香料到纪念品应有尽有，人群熙熙攘攘，体现了悉尼多元文化的市井生活气息。","firstSourceSecond":9310.0,"photos":[{"src":"full_chapter_media/video_070_1p0/c04_m001.jpg","sourceAsset":"sydney_07_000932","focusMs":0,"originalSecond":9310.0,"clipSeq":77,"caption":"唐人街牌坊","hero":true},{"src":"full_chapter_media/video_070_1p0/c04_m002.jpg","sourceAsset":"sydney_07_000956","focusMs":0,"originalSecond":9550.0,"clipSeq":79,"caption":"市场入口","hero":f
